name: Push to Google Apps Script

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  clasp-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install clasp
        run: npm install -g @google/clasp

      - name: Write clasp credentials
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          CLASP_JSON: ${{ secrets.CLASP_JSON }}
        run: |
          if [ -z "$CLASPRC_JSON" ] || [ -z "$CLASP_JSON" ]; then
            echo "Missing CLASPRC_JSON or CLASP_JSON repository secret."
            exit 1
          fi
          printf '%s\n' "$CLASPRC_JSON" > ~/.clasprc.json
          printf '%s\n' "$CLASP_JSON" > .clasp.json

      - name: Push to Apps Script
        run: clasp push --force
